name: 이미지 받기

on:
  workflow_dispatch:
    inputs:
      force:
        description: 이미 있는 로고도 다시 받기
        type: boolean
        default: false
      shot:
        description: 브라우저로 고해상도 로고 후보 찍기(assets/logo-hi)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: 브라우저 준비
        if: inputs.shot
        run: npx playwright install --with-deps chromium
      - name: 로고 받기
        run: node bin/pics.mjs ${{ inputs.force && '--force' || '' }} ${{ inputs.shot && '--shot' || '' }}
      - name: 결과 올리기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/logo assets/logo-hi 2>/dev/null || git add assets/logo
          if git diff --cached --quiet; then echo "바뀐 파일 없음"; exit 0; fi
          git commit -m "자료: 로고 갱신"
          git push
