name: 게시

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      - name: 빌드
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node bin/compose.mjs
      - name: 주소 자리표시 확인
        run: |
          if grep -rqF "e097fv9iz.invalid" _site; then
            echo "::error::주소 자리표시가 남아 있어 게시를 멈춥니다."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
